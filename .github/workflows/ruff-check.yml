name: Ruff
on: [push, pull_request]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.8.5"
          args: "check"
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: ruff format --check
